# Pi-Star skin: add a viewport tag, stylesheet and theme script to every
# stock Pi-Star page, so none of Pi-Star's own files need editing.
# /live/ omits its </head> tag so it is left alone.
# Remove this file and reload nginx to restore the stock look.
sub_filter '</head>' '<meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" type="text/css" href="/skin/skin.css?v=15"><script src="/skin/skin.js?v=8"></script></head>';
sub_filter_once on;
